spring:
  profiles:
    active: dev

  application:
    name: backend

  config:
    import:
      - optional:classpath:db.properties
      - optional:classpath:security.yml

  jpa:
    show-sql: true
    properties:
      hibernate:
        highlight_sql: true
        format_sql: true
        use_sql_comments: true

server:
  port: 8080
