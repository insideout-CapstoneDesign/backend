spring:
  profiles:
    active: dev

  application:
    name: backend

  sql:
    init:
      mode: never

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
      - optional:classpath:db.properties
      - optional:classpath:security.yml

  jpa:
    show-sql: true
    properties:
      hibernate:
        highlight_sql: true
        format_sql: true
        use_sql_comments: true

tmap:
  api:
    key: ${TMAP_API_KEY:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:ap-northeast-2}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    bucket: ${S3_BUCKET}
    path-style-access: true

ai:
  service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key-header: ${AI_API_KEY_HEADER:x-api-key}
    api-key: ${AI_API_KEY:default-key-for-local-dev}
    timeout-seconds: ${AI_SERVICE_TIMEOUT:120}

place:
  search:
    bootstrap:
      enabled: ${PLACE_SEARCH_BOOTSTRAP_ENABLED:false}
      batch-size: ${PLACE_SEARCH_BOOTSTRAP_BATCH_SIZE:500}
      lock-id: ${PLACE_SEARCH_BOOTSTRAP_LOCK_ID:91000001}
